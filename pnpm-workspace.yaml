packages:
  - packages/*
  - examples/*

nodeLinker: hoisted
dedupeDirectDeps: true

overrides:
  "metro": "^0.83.3"
  "metro-resolver": "^0.83.3"
  "metro-config": "^0.83.3"
  "@expo/metro-runtime": "55.0.12"
  "undici": "^6.27.0"
  "lodash": "^4.18.0"
  "tmp": "^0.2.6"
  "brace-expansion": "^5.0.8"
  "uuid": "^11.1.1"

patchedDependencies:
  "minimatch@3.1.5": "patches/minimatch@3.1.5.patch"

# pnpm 11 renamed `onlyBuiltDependencies` to `allowBuilds`, which is a map so a
# package can also be explicitly denied.
allowBuilds:
  "@swc/core": true
