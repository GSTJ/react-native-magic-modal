packages:
  - packages/*
  - examples/*
  - apps/*

nodeLinker: hoisted
dedupeDirectDeps: true

overrides:
  "metro": "^0.83.3"
  "metro-resolver": "^0.83.3"
  "metro-config": "^0.83.3"
  "@expo/metro-runtime": "55.0.12"
  "undici": "^8.0.0"
  "lodash": "^4.18.0"
  "tmp": "^0.2.6"
  "brace-expansion": "^5.0.9"
  "fast-uri": "^4.0.0"
  "hono": "^4.12.34"
  "uuid": "^14.0.0"
  # Both of these reach us through next in apps/docs, and bumping next fixes
  # neither. It pins `"postcss": "8.4.31"` exactly and takes `sharp: "^0.34.5"`
  # as an optional dep, still true on 16.2.12, the latest release. An override
  # is the only lever.
  #
  # postcss 8.4.31 is GHSA-qx2v-qp2m-jg93, GHSA-6g55-p6wh-862q and
  # GHSA-r28c-9q8g-f849. 8.5.23 was already in the tree for @tailwindcss/postcss,
  # so this dedupes to one copy rather than adding a version.
  "postcss": "^8.5.23"
  # sharp 0.34.5 inherits the libvips CVEs in GHSA-f88m-g3jw-g9cj. The docs site
  # is a static export, so next never runs the image optimizer and never loads
  # sharp, but it ships in the lockfile either way, so it gets patched.
  "sharp": "^0.35.3"

patchedDependencies:
  "minimatch@3.1.5": "patches/minimatch@3.1.5.patch"

# pnpm 11 renamed `onlyBuiltDependencies` to `allowBuilds`, which is a map so a
# package can also be explicitly denied.
allowBuilds:
  "@swc/core": true
  "esbuild": true
  "sharp": true

# pnpm 11 quarantines anything published in the last 24 hours and enforces it on
# `--frozen-lockfile`, so CI refuses a lockfile that adopts a release on its
# publish day. These four were adopted deliberately within that window. Delete
# each line once the version ages past it — they are no-ops from then on.
minimumReleaseAgeExclude:
  - "magic-oxlint-config@1.2.0"
  - "magic-oxfmt-config@1.2.0"
  - "magic-tsconfig@1.2.0"
  - "magic-codemods@1.1.0"
  - "brace-expansion@5.0.9" # GHSA-rgw5-rvv9-x895
  - "fast-uri@3.1.5" # GHSA-7p8r-x3mc-p8w7
  - "hono@4.12.34" # GHSA-8j4g-w8fx-2239
  # Our own plugin, published from this account 2026-07-27 — same first-party
  # exemption the sibling repos carry. Version-pinned like the rest.
  - "eslint-plugin-safe-jsx@1.3.0"
  # Shared docs preset published from GSTJ/magic as part of this migration.
  - "magic-docs@1.0.0"
